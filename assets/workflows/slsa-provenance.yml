# Build provenance for release assets
# https://slsa.dev/
#
# Attests WHERE and HOW the published assets were built. The attestation is
# issued and stored by GitHub and verified with:
#
#   gh attestation verify <asset> --repo <owner>/<repo>
#
# Prerequisites:
# 1. Release assets must already exist (uploaded by the release workflow)
# 2. The repository must allow GitHub Actions to request an OIDC token
#
# WHY NOT slsa-framework/slsa-github-generator
#
# The generic generator is the usual answer for SLSA Level 3, and it cannot run
# under a SHA-pinning ruleset: its own generator_generic_slsa3.yml calls four
# nested actions by tag — detect-workflow-js, generate-builder,
# secure-download-artifact and secure-builder-checkout, all @v2.1.0, the latest
# release — and a repository or organisation with `sha_pinning_required` on
# rejects the run at the first of them. Pinning the generator's own `uses:` to a
# SHA does not help, because the rejected references are inside it, and the
# generator refuses to run from a SHA anyway. Upstream:
# https://github.com/slsa-framework/slsa-github-generator/issues/4440 (open).
#
# actions/attest-build-provenance is SHA-pinnable like any other action. What it
# does not give you is the isolated builder that Level 3 is about: state the
# level you actually reach, not the one the workflow is named after.
#
# THIS TEMPLATE IS SLSA BUILD LEVEL 2. FOR LEVEL 3, DO NOT USE IT.
#
# GitHub: attestations alone give Build Level 2; Level 3 needs checkout, build
# AND attestation inside one reusable workflow the project cannot edit. Moving
# only the attestation into a reusable is still Level 2, and so is building in
# a reusable but attesting outside it. At Netresearch, call the reusable for the kind of
# artefact from a tag-push workflow instead of this file:
#
#   source archive  netresearch/.github/.github/workflows/release-source-archive.yml
#   Go              netresearch/.github/.github/workflows/release-go-app.yml
#   TYPO3           netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml
#
# They build, generate SBOMs, sign, attest and create the release last, in one
# run. See references/slsa-provenance.md, "Which build level you get".

name: Build Provenance

on:
  release:
    types: [published]

permissions: read-all

jobs:
  provenance:
    name: Attest release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download release assets
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never interpolate github.event.* into a run: block — take it through
          # the environment, where it is data rather than script.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -D release-assets
          # An empty directory would make the attest step attest nothing while
          # still succeeding, so say so and stop.
          count=$(find release-assets -type f | wc -l)
          echo "assets: $count"
          test "$count" -gt 0
          # Attesting a signature or a checksum file alongside the artifact adds
          # subjects nobody verifies; keep those out. This is a deny-list, so it
          # only knows the names below -- check it against what your release
          # actually publishes before copying this workflow.
          find release-assets -type f \
            \( -name '*.sig' -o -name '*.asc' -o -name '*.pem' \
               -o -name '*.sha256' -o -name '*.sha512' \
               -o -name 'SHA256SUMS' -o -name 'SHA512SUMS' -o -name 'checksums.txt' \
               -o -name '*.intoto.jsonl' \) \
            -delete
          test "$(find release-assets -type f | wc -l)" -gt 0

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
